<!doctype html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>{{ graph.title or "Untitled Graph" }} - math</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='calculator.css') }}">
  <script src="https://www.desmos.com/api/v1.13/calculator.js?apiKey={{ api_key }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</head>
<body data-graph-id="{{ graph.id }}">
  {% from "_topbar.html" import topbar %}
  {% call topbar(save_status=True) %}
  <input id="title" class="tb-title title-input" type="text" value="{{ graph.title }}" placeholder="Untitled Graph"
         maxlength="200" autocomplete="off" spellcheck="false" aria-label="Graph title" disabled>
  {% endcall %}
  <div id="calculator"></div>
</body>
</html>
