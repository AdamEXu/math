<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>math</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <style>
    html, body, #calculator { margin: 0; width: 100%; height: 100%; }
  </style>
  <script src="https://www.desmos.com/api/v1.13/calculator.js?apiKey={{ api_key }}"></script>
</head>
<body>
  <div id="calculator"></div>
  <script>
    Desmos.GraphingCalculator(document.getElementById("calculator"), {
      keypad: true,
      graphpaper: true,
      expressions: true,
      settingsMenu: true,
      zoomButtons: true,
      expressionsTopbar: true,
      pointsOfInterest: true,
      trace: true,
      border: false,
      authorFeatures: true,
      images: true,
      folders: true,
      notes: true,
      sliders: true,
      actions: true,
      substitutions: true,
      links: true,
      distributions: true,
      calculus: true,
      pasteGraphLink: true,
      pasteTableData: true,
      zoomFit: true,
      customRegressions: true,
      regressionTemplates: true,
      logScales: true,
      tone: true,
      audio: true,
      muted: false,
      intervalComprehensions: true,
      allowComplex: true,
      matrices: true,
      recursion: true,
      showEvaluationCopyButtons: true,
      decimalToFraction: true,
      plotInequalities: true,
      plotImplicits: true,
      plotSingleVariableImplicitEquations: true,
      brailleControls: true,
      invertedColorsControl: true,
    });
  </script>
</body>
</html>
