<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>math</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      font-family: system-ui, -apple-system, sans-serif; color: #222; background: #fafafa;
    }
    a.button, button.button {
      padding: 10px 20px; border: 1px solid #ccc; border-radius: 6px; background: #fff;
      color: inherit; text-decoration: none; font: inherit; font-size: 15px; cursor: pointer;
    }
    a.button:hover, button.button:hover { background: #f0f0f0; }
    button.dev { border-style: dashed; color: #555; }
    .dev-other { display: flex; gap: 8px; }
    .dev-other input { padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; font: inherit; font-size: 15px; }
    .error { color: #b00020; font-size: 14px; }
  </style>
</head>
<body>
  <a class="button" href="{{ url_for('auth.google', next=next) }}">Sign in with Google</a>
  {% if dev_email %}
  <form method="post" action="{{ url_for('auth.dev_login', next=next) }}">
    <button class="button dev" type="submit">Dev sign-in as {{ dev_email }}</button>
  </form>
  <form class="dev-other" method="post" action="{{ url_for('auth.dev_login', next=next) }}">
    <input name="email" type="email" placeholder="someone@pinewood.edu" required aria-label="Dev email">
    <button class="button dev" type="submit">Dev sign-in</button>
  </form>
  {% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
</body>
</html>
