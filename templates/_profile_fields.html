<div class="field">
  <label class="label" for="display_name">Display name</label>
  <input class="text-input" id="display_name" name="display_name" type="text" value="{{ profile.display_name }}"
         maxlength="50" autocomplete="name" required>
  {% if errors.display_name %}<p class="field-error"><i data-lucide="circle-alert"></i>{{ errors.display_name }}</p>
  {% else %}<p class="hint">Shown to people you share graphs with.</p>{% endif %}
</div>
<div class="field">
  <label class="label" for="handle">Handle</label>
  <div class="handle-input">
    <span class="at">@</span>
    <input id="handle" name="handle" type="text" value="{{ profile.handle }}" maxlength="21" autocomplete="off"
           autocapitalize="off" spellcheck="false" required data-current="{{ current_user.handle or '' }}"
           aria-describedby="handle-status">
  </div>
  <p class="handle-status" id="handle-status" data-state="{{ 'error' if errors.handle else 'idle' }}" aria-live="polite">
    <i data-lucide="circle-check" class="when-ok"></i><i data-lucide="circle-alert" class="when-error"></i><span>{{ errors.handle or "3 to 20 characters: letters, numbers and underscores, starting with a letter." }}</span>
  </p>
</div>
