[project]
name = "math"
version = "0.1.0"
description = "math.pinewood.club"
requires-python = ">=3.12"
dependencies = [
    "a2wsgi>=1.10.10",
    "flask>=3.1.3",
    "pycrdt>=0.14.10",
    "requests>=2.34.2",
    "starlette>=1.9.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
